name: Deploy
on:
  push:
    branches: [main]
    paths: [web/**, infra/**, .github/workflows/deploy.yml]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    uses: rclegg/aws-static-site-template/.github/workflows/deploy-static-site.yml@main
    secrets: inherit
    with:
      stack-name: sleeper-lineup-compare
      aws-region: us-east-1
      template: infra/site.yaml
      site-dir: web
